name: Codehouse daily reviewed article

on:
  schedule:
    - cron: '0 10 * * *'
      timezone: Europe/Athens
    - cron: '30 10 * * *'
      timezone: Europe/Athens
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect the next article without publishing, or apply the daily article
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - apply

permissions:
  contents: write

concurrency:
  group: codehouse-server-maintenance
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the current reviewed website
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OPERATION: ${{ github.event_name == 'schedule' && 'apply' || inputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != codehouse-products/codehouse.gr ]]; then
            echo "Unexpected repository." >&2
            exit 1
          fi
          if [[ "$RELEASE_OPERATION" != inspect && "$RELEASE_OPERATION" != apply ]]; then
            echo "Invalid operation." >&2
            exit 1
          fi
          SOURCE_COMMIT="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/releases/reviewed-public" \
            --jq '.object.sha')"
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid reviewed source." >&2
            exit 1
          fi
          printf 'commit=%s\n' "$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'operation=%s\n' "$RELEASE_OPERATION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: 0e241f00e9ddc757f2049d19d74a5fbfbd36c149
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: decbc1d46f76f56463f6c101b919edc04177c72e
          path: ops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: site
          persist-credentials: false
      - name: Prepare one reviewed article for today
        id: article
        shell: bash
        run: |
          set -euo pipefail
          python3 publisher/scripts/editorial_queue.py --source site --report editorial-report.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("editorial-report.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("ready=" + str(report["ready"]).lower() + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Codehouse daily editorial\n\n")
              summary.write(f"- Result: {report['reason']}\n")
              summary.write(f"- Remaining reviewed articles: {report['remaining']}\n")
              if report.get("slug"):
                  summary.write(f"- URL: https://codehouse.gr/blog/{report['slug']}/\n")
              if not report["remaining"]:
                  summary.write("\nThe reviewed queue is exhausted. Add new reviewed articles; no filler will be published.\n")
          PY
      - name: Verify the complete prepared website
        if: steps.article.outputs.ready == 'true'
        working-directory: site
        run: |
          python3 scripts/check_public_site.py
          python3 scripts/test_contact_intro.py
          php -l lead.php
          python3 scripts/test_lead.py
          python3 ../publisher/scripts/verify_editorial.py --source . --report ../editorial-report.json
      - name: Commit only the verified article files
        id: commit
        if: steps.article.outputs.ready == 'true' && steps.source.outputs.operation == 'apply'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          python3 publisher/scripts/editorial_commit.py \
            --source site --report editorial-report.json --expected "$EXPECTED_SOURCE"
      - name: Package the immutable public release
        id: package
        if: steps.article.outputs.ready == 'true' && steps.source.outputs.operation == 'apply'
        shell: bash
        env:
          SITE_RELEASE_COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p upload
          python3 ops/scripts/build_site_release.py \
            --source site --commit "$SITE_RELEASE_COMMIT" --output upload/site-release.tar.gz
          cp ops/scripts/server_release.py ops/scripts/server_release_prerequisites.py \
            ops/scripts/server_privacy.py upload/
          chmod 600 upload/*
          echo "sha256=$(sha256sum upload/site-release.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Stage outside the public website
        if: steps.article.outputs.ready == 'true' && steps.source.outputs.operation == 'apply'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: upload/*
          target: /var/lib/codehouse-release-incoming
          strip_components: 1
          overwrite: true
          rm: false
          command_timeout: 5m
      - name: Inspect and safely apply the article release
        if: steps.article.outputs.ready == 'true' && steps.source.outputs.operation == 'apply'
        uses: appleboy/ssh-action@v1
        env:
          SITE_RELEASE_OPERATION: apply
          SITE_RELEASE_SHA256: ${{ steps.package.outputs.sha256 }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SITE_RELEASE_OPERATION,SITE_RELEASE_SHA256
          command_timeout: 5m
          script: |
            set -eu
            SITE_RELEASE_OPERATION=inspect python3 /var/lib/codehouse-release-incoming/server_release.py
            python3 /var/lib/codehouse-release-incoming/server_release.py
      - name: Confirm consumption only after verified server apply
        if: steps.article.outputs.ready == 'true' && steps.source.outputs.operation == 'apply'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          python3 publisher/scripts/editorial_commit.py \
            --source site --report editorial-report.json \
            --expected "$EXPECTED_SOURCE" --acknowledge
