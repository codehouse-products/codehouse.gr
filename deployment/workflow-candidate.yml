name: Codehouse controlled release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect the server first; apply publishes the reviewed release
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - apply
      site_commit:
        description: Optional reviewed commit SHA; leave empty for the latest reviewed public release
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: codehouse-server-maintenance
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate the reviewed release
        id: review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_COMMIT: ${{ inputs.site_commit }}
          SITE_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$SITE_OPERATION" != inspect && "$SITE_OPERATION" != apply ]]; then
            echo "Invalid release operation." >&2
            exit 1
          fi
          if [[ -n "$SITE_COMMIT" && ! "$SITE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The release must be a full lowercase Git commit SHA." >&2
            exit 1
          fi
          REVIEWED_COMMIT="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/releases/reviewed-public" \
            --jq '.object.sha')"
          if [[ ! "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The reviewed public release reference is invalid." >&2
            exit 1
          fi
          if [[ -n "$SITE_COMMIT" && "$SITE_COMMIT" != "$REVIEWED_COMMIT" ]]; then
            echo "This commit is not the current reviewed public release." >&2
            exit 1
          fi
          printf 'commit=%s\n' "$REVIEWED_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'Reviewed public version: %s\n' "$REVIEWED_COMMIT"
      - uses: actions/checkout@v4
        with:
          ref: decbc1d46f76f56463f6c101b919edc04177c72e
          path: ops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.review.outputs.commit }}
          path: site
          persist-credentials: false
      - name: Verify the reviewed website
        working-directory: site
        run: |
          python3 scripts/check_public_site.py
          python3 scripts/test_contact_intro.py
          php -l lead.php
          python3 scripts/test_lead.py
      - name: Package public files only
        id: package
        shell: bash
        env:
          SITE_RELEASE_COMMIT: ${{ steps.review.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p upload
          python3 ops/scripts/build_site_release.py \
            --source site \
            --commit "$SITE_RELEASE_COMMIT" \
            --output upload/site-release.tar.gz
          cp ops/scripts/server_release.py ops/scripts/server_release_prerequisites.py \
            ops/scripts/server_privacy.py upload/
          chmod 600 upload/*
          echo "sha256=$(sha256sum upload/site-release.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Stage outside the public website
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: upload/*
          target: /var/lib/codehouse-release-incoming
          strip_components: 1
          overwrite: true
          rm: false
          command_timeout: 5m
      - name: Inspect or apply the verified release
        uses: appleboy/ssh-action@v1
        env:
          SITE_RELEASE_OPERATION: ${{ inputs.operation }}
          SITE_RELEASE_SHA256: ${{ steps.package.outputs.sha256 }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SITE_RELEASE_OPERATION,SITE_RELEASE_SHA256
          command_timeout: 5m
          script: |
            set -eu
            python3 /var/lib/codehouse-release-incoming/server_release.py
