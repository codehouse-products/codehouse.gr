# Codehouse.gr — Nginx performance include
# Drop this into /etc/nginx/conf.d/ or include from site block

# ── Gzip ──────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
  text/plain text/css text/xml text/javascript
  application/javascript application/x-javascript
  application/json application/xml application/rss+xml
  image/svg+xml font/woff font/woff2;

# ── Static asset caching ───────────────────────────────────────────
location ~* \.(css|js)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary Accept-Encoding;
}

location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ~* \.(html|php)$ {
    expires 10m;
    add_header Cache-Control "public, must-revalidate";
    add_header Vary Accept-Encoding;
}
