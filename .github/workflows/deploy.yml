name: Server privacy maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect first; protect only after reviewing the result
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - protect

permissions:
  contents: read

concurrency:
  group: codehouse-server-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 50322b6582f7570dd93946974f04f50c6a9ed045
          persist-credentials: false

      - name: Prepare reviewed maintenance script
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'set -eu'
            echo "python3 - <<'CODEHOUSE_PRIVATE_PY'"
            cat scripts/server_privacy.py
            echo
            echo 'CODEHOUSE_PRIVATE_PY'
          } > "$RUNNER_TEMP/server-privacy.sh"

      - name: Run controlled server maintenance
        uses: appleboy/ssh-action@v1
        env:
          SITE_OPERATION: ${{ inputs.operation }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SITE_OPERATION
          command_timeout: 3m
          script_path: ${{ runner.temp }}/server-privacy.sh
