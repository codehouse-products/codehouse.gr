# SECURITY: include this file INSIDE the production site's existing server {}
# block, then run nginx -t before reloading. Merely committing this file does
# NOT activate these rules. Do not put bare location blocks at http{} scope.
#
# Protect historical data without reading, deleting or moving it. New lead.php
# submissions are already persisted outside the public document root.
location ^~ /leads/ { return 404; }
location ^~ /scripts/ { return 404; }
location ^~ /attached_assets/ { return 404; }
location ^~ /docs/ { return 404; }
location ~ /\.(?!well-known/) { return 404; }
location ~* \.(jsonl|log|env|sql|sqlite|ini|bak)$ { return 404; }
location = /main.py { return 404; }
location = /pyproject.toml { return 404; }
location = /uv.lock { return 404; }
location = /replit.md { return 404; }
location = /router.php { return 404; }
location = /nginx-private.conf { return 404; }
location = /nginx-perf.conf { return 404; }